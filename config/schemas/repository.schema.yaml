# JSON Schema for repositories/<repo>/repository.yaml (spec §10, §11, §56) and for entries of config/repositories.yaml. JSON-compatible YAML.
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "aisdlc/repository.schema.yaml",
  "title": "aisdlc repository knowledge record",
  "type": "object",
  "required": ["name", "path", "role", "base_branch", "domains", "depends_on", "provides", "analyzed_commit", "status"],
  "properties": {
    "name": { "type": "string", "minLength": 1 },
    "path": { "type": "string", "minLength": 1 },
    "role": { "type": "string" },
    "base_branch": { "const": "main", "description": "Managed repositories MUST use main; otherwise non-compliant." },
    "domains": { "type": "array", "items": { "type": "string" } },
    "depends_on": { "type": "array", "items": { "type": "string" } },
    "provides": { "type": "array", "items": { "type": "string" } },
    "ui": { "type": "boolean", "description": "True for repositories with a user interface; their features go through /aisdlc:ui-design." },
    "deployment": { "type": "object", "additionalProperties": true },
    "analyzed_commit": { "type": "string", "minLength": 4 },
    "analyzed_at": { "type": "string" },
    "generator": { "type": "string", "description": "e.g. aisdlc@1.0.0" },
    "status": { "enum": ["current", "needs-refresh", "non-compliant", "deprecated"] },
    "technology": {
      "type": "object",
      "properties": {
        "languages": { "type": "array", "items": { "type": "string" } },
        "frameworks": { "type": "array", "items": { "type": "string" } }
      }
    },
    "entrypoints": { "type": "array", "items": { "type": "string" } },
    "testing": { "type": "object", "properties": { "profile": { "type": "string" } } },
    "knowledge": {
      "type": "object",
      "description": "Provenance for generated knowledge areas (spec §10).",
      "additionalProperties": {
        "type": "object",
        "required": ["status", "confidence"],
        "properties": {
          "status": { "enum": ["observed", "inferred", "human-confirmed", "deprecated", "conflicted"] },
          "confidence": { "enum": ["high", "medium", "low"] },
          "evidence": { "type": "array", "items": { "type": "string" } }
        }
      }
    }
  }
}
