# Repository registry (spec §11). JSON-compatible YAML; managed by /aisdlc:add-repo.
# Required per repo: path, role, base_branch (must be "main"), domains, depends_on, provides.
{
  "repositories": {
    "manufacturer-hl7-parser": {
      "path": "${AISDLC_REPOS_ROOT}/manufacturer-hl7-parser",
      "role": "Backend ingestion pipeline (AWS Lambda) that turns cardiac-device manufacturer HL7 transmissions (Abbott, Biotronik, Boston Scientific, Medtronic) into patients, reports, automated notes and billing schedules in the shared Evoke MongoDB",
      "system_role": "Developer-confirmed (2026-10-01): backend ingestion pipeline with no direct end users; output is consumed through other Evoke applications",
      "base_branch": "main",
      "domains": ["transmission-ingestion", "report-notes", "billing", "patient-registry"],
      "depends_on": ["hl7-file-sync-service", "patient-billing-schedule", "benchmark-sqs-consumer", "cardio-one-sqs-consumer"],
      "provides": ["device-transmission-report-ingestion", "automated-report-notes-and-alerts", "billing-code-and-schedule-assignment", "patient-and-device-registration"],
      "deployment": {
        "type": "aws-lambda",
        "pipeline": "bitbucket-pipelines.yml",
        "environments": {
          "lf-develop": "Development",
          "lf-qa": "Quality Assurance",
          "lf-uat": "Pre Production",
          "main": "Production"
        }
      }
    },
    "rest-api-evoke": {
      "path": "${AISDLC_REPOS_ROOT}/rest-api-evoke",
      "role": "Express REST API (Node.js, Mongoose, one long-running process in a Docker image) behind the Evoke clinician web portal: patients, device transmissions and reports, alerts, billing and RPM, HL7/SFTP/API export jobs, outreach, accounts and access",
      "system_role": "Developer-confirmed (2026-10-02): portal back end used by clinic staff, physicians and Evoke staff through evoke-portal-front-end; also receives third-party webhooks and service-JWT calls; owns app data and shares ingestion collections with manufacturer-hl7-parser",
      "base_branch": "main",
      "domains": ["report-notes", "transmission-ingestion", "patient-registry", "alerts", "billing", "ehr-export", "patient-outreach", "access-administration"],
      "depends_on": ["benchmark-sqs-consumer", "cardio-one-sqs-consumer", "alert-notification-worker", "manufacturer-crawler", "client-ehr-hl7-export", "intergy-api-job-consumer", "sftp-export-consumer", "twilio-reminders-lambda"],
      "provides": ["report-review-notes-and-assignment", "device-transmission-report-ingestion", "patient-and-device-registration", "automated-report-notes-and-alerts", "billing-code-and-schedule-assignment", "ehr-export-hl7-sftp-api-jobs", "patient-outreach", "access-and-account-administration"],
      "deployment": {
        "type": "docker-image-on-kubernetes",
        "pipeline": "bitbucket-pipelines.yml",
        "environments": {
          "lf-develop": "Development",
          "lf-qa": "QA",
          "lf-uat": "Pre-production",
          "main": "Production"
        }
      }
    },
    "evoke-portal-front-end": {
      "path": "${AISDLC_REPOS_ROOT}/evoke-portal-front-end",
      "role": "React single-page web portal (Create React App, Redux Toolkit, MUI) served by nginx, through which Evoke staff, partner-clinic staff and physicians review cardiac-device transmissions and reports, manage patients and RPM, tasks, billing, dashboards and configuration, by calling rest-api-evoke",
      "ui": true,
      "system_role": "Developer-confirmed (2026-10-02): clinician and staff web portal used by Evoke operators and partner-clinic staff; its REST API is rest-api-evoke; realtime namespaces come from a separate socket service; it owns no persistent data",
      "base_branch": "main",
      "domains": ["clinician-portal", "report-notes", "patient-registry", "rpm", "tasks", "billing", "access-administration", "patient-communication"],
      "depends_on": ["rest-api-evoke", "realtime-socket-service", "aws-cognito", "clinii-rpm-portal", "zoom-phone"],
      "provides": ["report-review-notes-and-assignment", "patient-management-and-rpm", "task-management", "billing-management", "access-and-account-administration", "administration-and-configuration", "dashboard-and-notifications", "patient-communication"],
      "deployment": {
        "type": "static-spa-in-nginx-docker-image-on-kubernetes",
        "pipeline": "bitbucket-pipelines.yml",
        "environments": {
          "lf-develop": "Development",
          "lf-qa": "Quality Assurance",
          "lf-uat": "Pre Production",
          "main": "Production"
        }
      }
    },
    "patient-billing-schedule": {
      "path": "${AISDLC_REPO_PATIENT_BILLING_SCHEDULE}",
      "role": "Python AWS Lambda that decides, per patient and RPM billing code, which transmission report is billable and when (billing windows, next send and late dates), creates and archives follow-up tasks for late patients, deactivates patients with no report for 730 days and sends bot events for late patients",
      "system_role": "Developer-confirmed (2026-10-05): back-end billing scheduler with no end users, invoked by manufacturer-hl7-parser, rest-api-evoke and SQS/EventBridge-driven account batches; the same service the parser calls billing-schedule-lambda (remote name patient-schedule-monitoring); owns billing_activity_logger and manufacturer_crawler_report_status",
      "base_branch": "main",
      "domains": ["billing", "patient-registry", "patient-outreach"],
      "depends_on": ["rest-api-evoke", "manufacturer-crawler"],
      "provides": ["billing-code-and-schedule-assignment", "billing-window-scheduling", "patient-management-and-rpm", "patient-and-device-registration"],
      "deployment": {
        "type": "aws-lambda",
        "pipeline": "bitbucket-pipelines.yml",
        "environments": {
          "lf-qa": "QA",
          "lf-uat": "Pre Production",
          "main": "Production"
        },
        "notes": "No lf-develop pipeline; every push to lf-qa, lf-uat or main zips the source and updates the Lambda with no tests or manual gate (build-release.md)."
      }
    },
    "client-emr-hl7-parser": {
      "path": "${AISDLC_REPOS_ROOT}/client-emr-hl7-parser",
      "role": "Python AWS Lambda (EMR integration) that builds outbound HL7 messages (ORU_R01, DFT_P03, IDCO ORU) from Evoke reports for client EMR accounts and parses inbound ADT, ORM, ORU and ACK messages from them, creating or updating patients, onboarding tasks, ADT records and acknowledgements in the shared Evoke MongoDB",
      "system_role": "Developer-confirmed (2026-10-09): EMR integration Lambda with no end users; parsing events come from an inbound EMR transport service or manual CLI runs, creation events from a trigger fed by the rest-api-evoke hl7job SNS topic; generated HL7 in S3 is delivered to the EMRs by client-ehr-hl7-export; owns adts, adts_book_keeping and acks",
      "base_branch": "main",
      "domains": ["ehr-export", "patient-registry"],
      "depends_on": ["rest-api-evoke", "manufacturer-hl7-parser"],
      "provides": ["ehr-export-hl7-sftp-api-jobs", "patient-and-device-registration", "ehr-delivery-acknowledgements"],
      "deployment": {
        "type": "aws-lambda",
        "pipeline": "bitbucket-pipelines.yml",
        "environments": {
          "lf-uat": "User Acceptance Testing",
          "main": "Production"
        },
        "notes": "Only lf-uat and main have pipelines; each push zips the source and updates the Lambda with no tests or manual gate. No lf-develop or lf-qa pipeline on this commit (build-release.md)."
      }
    }
  }
}
