# Task types and state machines (spec §18, §19). Consumed by scripts/state/aisdlc-state.js and hooks.
# JSON-compatible YAML so scripts can parse it without dependencies.
{
  "feature": {
    "states": ["CREATED","TICKET_READY","UNDERSTOOD","IMPACT_ANALYZED","REPOSITORIES_IDENTIFIED","REPOSITORIES_PREPARED","SPEC_DRAFTED","AWAITING_SPEC_APPROVAL","SPEC_APPROVED","PLAN_DRAFTED","AWAITING_PLAN_APPROVAL","IMPLEMENTING","VALIDATING","REVIEWING","COMMITTING","COMMITTED","PR_CREATED","CI_VALIDATING","MERGE_READY","MERGED","RELEASE_PENDING","RELEASED","KNOWLEDGE_CONSOLIDATION_PENDING","KNOWLEDGE_CONSOLIDATED","TEMPORARY_ARTIFACTS_CLEANED","COMPLETED"],
    "skip": { "PLAN_DRAFTED": ["IMPLEMENTING"] },
    "source_edit_min_state": "SPEC_APPROVED",
    "source_edit_max_state": "COMMITTED"
  },
  "bug": {
    "states": ["CREATED","TICKET_READY","UNDER_INVESTIGATION","ROOT_CAUSE_CONFIRMED","REPOSITORIES_IDENTIFIED","REPOSITORIES_PREPARED","IMPLEMENTING","VALIDATING","REVIEWING","COMMITTING","COMMITTED","PR_CREATED","CI_VALIDATING","COMPLETED"],
    "skip": {},
    "source_edit_min_state": "REPOSITORIES_PREPARED",
    "source_edit_max_state": "COMMITTED"
  },
  "investigation": {
    "states": ["CREATED","TICKET_READY","UNDER_INVESTIGATION","COMPLETED"],
    "skip": {},
    "source_edit_min_state": null,
    "source_edit_max_state": null
  },
  "failure_states": ["BLOCKED","WAITING_FOR_INPUT","WAITING_FOR_APPROVAL","CONFLICTED","FAILED","CANCELLED","CI_FAILED","JIRA_CHANGED","SPEC_REVIEW_REQUIRED"],
  "other_types_use": "feature",
  "next_steps": {
    "default": {
      "CREATED": ["claude", "Retrieve the ticket (Jira, or interactive questions if Jira is unavailable)."],
      "TICKET_READY": ["claude", "Summarize the requirement, acceptance criteria, constraints and unknowns; resolve unknowns that affect design."],
      "UNDERSTOOD": ["claude", "Run impact analysis across the registered repositories."],
      "IMPACT_ANALYZED": ["you", "Review tasks/{T}/impact-analysis.md and confirm the affected repositories."],
      "REPOSITORIES_IDENTIFIED": ["claude", "Prepare each affected repository: stash, update main, create branch {T}."],
      "REPOSITORIES_PREPARED": ["claude", "Draft the specification into tasks/{T}/specification.md."],
      "SPEC_DRAFTED": ["you", "Read tasks/{T}/specification.md; check scope, acceptance criteria and open questions."],
      "AWAITING_SPEC_APPROVAL": ["you", "Approve with /aisdlc:approve {T} specification, ask for changes, or /aisdlc:reject {T} specification <reason>. Source edits stay blocked until approved."],
      "SPEC_APPROVED": ["claude", "Draft the implementation plan."],
      "PLAN_DRAFTED": ["you", "Review the plan. Cross-repo, database, API or security changes need /aisdlc:approve {T} plan before implementation."],
      "AWAITING_PLAN_APPROVAL": ["you", "Approve with /aisdlc:approve {T} plan, or request changes."],
      "IMPLEMENTING": ["claude", "Implement in small steps and run tests as you go. You: review progress and answer questions."],
      "VALIDATING": ["claude", "Run the test matrix and record evidence in validation.md. You: decide on any failures or waivers."],
      "REVIEWING": ["claude", "Run independent code review against spec, plan and diff. You: read the findings."],
      "COMMITTING": ["you", "Confirm the commit with /aisdlc:commit {T} (message: {T}: <summary>)."],
      "COMMITTED": ["you", "Create the pull request(s) with /aisdlc:pr {T}."],
      "PR_CREATED": ["you", "Wait for CI. Claude can read check status; merging stays with you."],
      "CI_VALIDATING": ["you", "When all required checks pass, review and merge the PR(s). Merge is human-controlled."],
      "MERGE_READY": ["you", "Merge the PR(s)."],
      "MERGED": ["you", "Release to production through your normal process, then run /aisdlc:post-release {T}."],
      "RELEASE_PENDING": ["you", "Verify the production release, then run /aisdlc:post-release {T} (you will be asked for the deployment record if no integration exists)."],
      "RELEASED": ["you", "Run /aisdlc:post-release {T} to update product documentation."],
      "KNOWLEDGE_CONSOLIDATION_PENDING": ["claude", "Consolidate released behavior into system/product/. You: answer any reconciliation questions."],
      "KNOWLEDGE_CONSOLIDATED": ["claude", "Delete the temporary task artifacts and make the cleanup commit."],
      "TEMPORARY_ARTIFACTS_CLEANED": ["you", "Run /aisdlc:finish {T} to complete the task."],
      "COMPLETED": ["none", "Nothing further; the task is complete."]
    },
    "bug": {
      "TICKET_READY": ["claude", "Reproduce or understand the symptom and trace the execution path."],
      "UNDER_INVESTIGATION": ["claude", "Form and validate root-cause hypotheses; write tasks/{T}/root-cause.md (including Expected vs Actual)."],
      "ROOT_CAUSE_CONFIRMED": ["you", "Confirm the root cause, then Claude identifies the affected repositories."],
      "REPOSITORIES_PREPARED": ["claude", "Implement the minimal fix and add a regression test."],
      "IMPLEMENTING": ["claude", "Implement the fix and regression test; run tests. You: review."],
      "COMMITTED": ["you", "Create the pull request(s) with /aisdlc:pr {T}."],
      "CI_VALIDATING": ["you", "When CI passes, merge the PR(s); the bug task then completes."]
    },
    "investigation": {
      "UNDER_INVESTIGATION": ["claude", "Gather evidence and test hypotheses; write tasks/{T}/findings.md. Read-only: no source changes."]
    },
    "failure": {
      "BLOCKED": ["you", "Read the reason (tasks/{T}/task.yaml 'reason' and the BLOCKED message), fix the cause, then /aisdlc:resume {T}."],
      "WAITING_FOR_INPUT": ["you", "Answer Claude's open questions, then /aisdlc:resume {T}."],
      "WAITING_FOR_APPROVAL": ["you", "Approve or reject the pending gate with /aisdlc:approve {T} <gate> or /aisdlc:reject {T} <gate> <reason>."],
      "CONFLICTED": ["you", "Repository or task state differs from the record. Inspect branches and stashes, resolve by hand, then /aisdlc:resume {T}."],
      "FAILED": ["you", "Read the failure in the log, fix the cause, then /aisdlc:resume {T}."],
      "CANCELLED": ["none", "The task was cancelled."],
      "CI_FAILED": ["you", "Ask Claude to diagnose the failing checks; fixes follow the normal commit rules. Then /aisdlc:resume {T}."],
      "JIRA_CHANGED": ["you", "The ticket changed after approval. Review the change; the specification must be revised and re-approved."],
      "SPEC_REVIEW_REQUIRED": ["you", "Revise the specification for the ticket change, then /aisdlc:approve {T} specification."]
    }
  }
}
