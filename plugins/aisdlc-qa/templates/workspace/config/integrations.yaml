# External integrations for the QA workspace. JSON-compatible YAML; '#' comments only on their own lines.
# All Jira traffic goes over the Jira REST API through scripts/jira/jira-attach.js (no MCP server to set up): reading
# tickets ("issue", "status"), and - only when the matching "write" switch is true - defect comments, results comments,
# evidence uploads and status transitions. Tickets are asked for interactively when Jira is unavailable.
# Credentials are read from environment variables ONLY; this file stores their names, never values.
# Jira needs your site URL in "base_url" (not a secret).
# auth_scheme: "basic" (Jira Cloud: email + API token) or "bearer" (Jira Data Center personal access token).
# acceptance_criteria_field: optional custom field id (e.g. "customfield_10050"); empty = find it by name, then fall
# back to an "Acceptance Criteria" section of the description.
# status_transitions: optional, explicit only. {"defect_found": "<transition name>"} moves the ticket when a defect is
# reported; {"verified": "<transition name>"} after sign-off. Names must match the Jira transition exactly (case aside).
# Empty = never transition. Transitions need the write:issue:jira scope.
{
  "jira": {
    "adapter": "rest-api",
    "base_url": "",
    "auth_scheme": "basic",
    "acceptance_criteria_field": "",
    "required_for_ticket_fetch": false,
    "read": ["issue", "fields", "description", "acceptance_criteria", "labels", "priority", "linked_issues", "comments"],
    "write": {
      "add_comment": false,
      "add_attachment": false,
      "mention_assignee": false,
      "status_transitions": {}
    },
    "script": "${CLAUDE_PLUGIN_ROOT}/scripts/jira/jira-attach.js",
    "fallback": "interactive-questions",
    "credentials": {
      "email_env": "JIRA_EMAIL",
      "api_token_env": "JIRA_API_TOKEN"
    },
    "token_scopes": {
      "read:issue:jira": "Fetch the ticket and its basic fields",
      "read:issue-details:jira": "Description, labels, priority, linked issues",
      "read:comment:jira": "Read developer replies while a defect waits for a fix",
      "read:field:jira": "Find the custom field holding acceptance criteria",
      "write:comment:jira": "Post defect and results comments (only when add_comment is true)",
      "write:attachment:jira": "Upload screenshots and reports (only when add_attachment is true)",
      "write:issue:jira": "Move the ticket through a configured status transition (only when status_transitions is set)"
    }
  }
}
