# PM workspace marker (JSON-compatible YAML; full-line '#' comments only).
# A PM workspace does not register code repositories; this file's presence is what makes the folder an aisdlc
# workspace (resolved by the plugin's scripts/lib/root.js). The PM drafts requirements and acceptance criteria under
# tasks/<TICKET>/ and pushes them to the AISDLC server; there is no local code repository here.
{
  "repositories": {}
}
