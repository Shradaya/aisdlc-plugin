# External integrations (spec §6, §20, §40, §42.1). JSON-compatible YAML; '#' comments only on their own lines.
# Jira and git hosting are reached over their REST APIs by the plugin's own scripts (no MCP server to set up).
# Nothing here is assumed to be connected; `status` reports availability at runtime.
# Credentials are read from environment variables ONLY; this file stores the variable names, never values.
# Jira needs your site URL in "jira.base_url" (not a secret); the Jira variable names are an aisdlc convention.
# "auth_scheme": "basic" (Jira Cloud: email + API token) or "bearer" (Jira Data Center personal access token).
# "acceptance_criteria_field": optional custom field id (e.g. "customfield_10050"); empty = find it by name, then
# fall back to an "Acceptance Criteria" section of the description.
# "api_route": "auto" (default) tries the site URL first and falls back to the Atlassian API gateway on 401/403 -
# needed for a Jira Cloud token with granular scopes (e.g. read:issue:jira), which the site URL treats as anonymous.
# "site" or "gateway" skip that probe when you already know which one applies. "cloud_id" (from Jira > Settings >
# Products, or <site>/_edge/tenant_info) skips the lookup the gateway route makes on first use; "gateway_url"
# overrides https://api.atlassian.com (Jira Data Center's "bearer" scheme always uses the site URL; this never applies).
{
  "jira": {
    "adapter": "rest-api",
    "script": "${CLAUDE_PLUGIN_ROOT}/scripts/jira/jira-fetch.js",
    "base_url": "",
    "auth_scheme": "basic",
    "api_route": "auto",
    "cloud_id": "",
    "acceptance_criteria_field": "",
    "required_for_ticket_fetch": false,
    "read": ["issue", "fields", "description", "acceptance_criteria", "labels", "priority", "linked_issues", "comments_when_required"],
    "write": {
      "add_comment": false,
      "add_pr_link": false,
      "status_transitions": {}
    },
    "fallback": "interactive-questions",
    "credentials": {
      "email_env": "JIRA_EMAIL",
      "api_token_env": "JIRA_API_TOKEN"
    },
    "token_scopes": {
      "read:issue:jira": "Fetch the ticket and its basic fields",
      "read:issue-details:jira": "Description, labels, priority, linked issues",
      "read:comment:jira": "Comments, only when the workflow asks for them",
      "read:field:jira": "Find the custom field holding acceptance criteria",
      "read:project:jira": "Resolve the project a ticket belongs to",
      "read:jira-user": "The connection check (jira-fetch.js check calls /myself); also assignee and reporter names"
    }
  },
  "git_hosting": {
    "adapter": "rest-api",
    "provider": "bitbucket",
    "api_base": "https://api.bitbucket.org/2.0",
    "script": "${CLAUDE_PLUGIN_ROOT}/scripts/git-hosting/bitbucket-pr.js",
    "pr_target_branches": ["lf-develop", "lf-qa", "lf-uat"],
    "credentials": {
      "email_env": "BITBUCKET_EMAIL",
      "api_token_env": "BITBUCKET_API_TOKEN"
    },
    "token_scopes": {
      "read:repository:bitbucket": "Read repository content and pull request diffs",
      "read:pullrequest:bitbucket": "Read pull request details and status",
      "write:pullrequest:bitbucket": "Create pull requests (and post PR comments if enabled)"
    },
    "operations": ["create_pull_request", "read_pull_request_status", "read_pull_request", "read_pull_request_diff", "add_pr_comment"],
    "write": {
      "add_pr_comment": true
    }
  },
  "design": {
    "adapter": "claude-design-artifact",
    "tool": "Artifact (type: Design)",
    "access": "read-only",
    "operations": ["find_design", "read_design"],
    "title_contains": "<DESIGN-TICKET>",
    "storage": "system/designs/<DESIGN-TICKET>/"
  },
  "ci": {
    "adapter": "mcp",
    "provider": "configured-per-environment",
    "operations": ["read_check_status"]
  },
  "release": {
    "adapter": "mcp",
    "provider": "configured-per-environment",
    "evidence_sources": ["integration", "user-provided"],
    "production_deployment": "disabled"
  }
}
