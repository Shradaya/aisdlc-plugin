# JSON Schema for repositories/<repo>/repository.yaml (spec §10, §11, §56) and for entries of config/repositories.yaml. JSON-compatible YAML.
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "aisdlc/repository.schema.yaml",
  "title": "aisdlc repository knowledge record",
  "type": "object",
  "required": ["name", "path", "role", "base_branch", "domains", "depends_on", "provides", "analyzed_commit", "status"],
  "properties": {
    "name": { "type": "string", "minLength": 1 },
    "path": { "type": "string", "minLength": 1 },
    "role": { "type": "string" },
    "base_branch": { "const": "main", "description": "Managed repositories MUST use main; otherwise non-compliant." },
    "domains": { "type": "array", "items": { "type": "string" } },
    "depends_on": { "type": "array", "items": { "type": "string" } },
    "provides": { "type": "array", "items": { "type": "string" } },
    "ui": { "type": "boolean", "description": "True for repositories with a user interface; their features go through /aisdlc-dev:design-link to pin an authored design." },
    "kind": { "type": "string", "enum": ["code", "design"], "description": "Repository kind. 'code' (default) is a managed source repository; 'design' is a read-only source of authored designs (designs/<ticket>/) registered with --kind design." },
    "deployment": { "type": "object", "additionalProperties": true },
    "on_edit": {
      "type": "array",
      "description": "Checks that run automatically after Claude edits a file in this repository (formatter, linter, related test). Only in config/repositories.yaml. See scripts/lib/on-edit.js.",
      "items": {
        "type": "object",
        "required": ["run"],
        "properties": {
          "files": { "type": "string", "description": "Comma-separated globs on the file's path in the repository or its bare name; default *." },
          "run": { "type": "string", "description": "Command run in the repository folder without a shell. {file} {rel} {name} {dir} {test} are filled in." },
          "fix": { "type": "boolean", "description": "A formatter: its exit code and output are ignored." },
          "test": { "type": "string", "description": "Path template; the rule runs only when that file exists." },
          "timeout": { "type": "number", "description": "Seconds the command may take (default 60, at most 170)." }
        }
      }
    },
    "analyzed_commit": { "type": "string", "minLength": 4 },
    "analyzed_at": { "type": "string" },
    "generator": { "type": "string", "description": "e.g. aisdlc@1.0.0" },
    "status": { "enum": ["current", "needs-refresh", "non-compliant", "deprecated"] },
    "technology": {
      "type": "object",
      "properties": {
        "languages": { "type": "array", "items": { "type": "string" } },
        "frameworks": { "type": "array", "items": { "type": "string" } }
      }
    },
    "entrypoints": { "type": "array", "items": { "type": "string" } },
    "testing": { "type": "object", "properties": { "profile": { "type": "string" } } },
    "knowledge": {
      "type": "object",
      "description": "Provenance for generated knowledge areas (spec §10).",
      "additionalProperties": {
        "type": "object",
        "required": ["status", "confidence"],
        "properties": {
          "status": { "enum": ["observed", "inferred", "human-confirmed", "deprecated", "conflicted"] },
          "confidence": { "enum": ["high", "medium", "low"] },
          "evidence": { "type": "array", "items": { "type": "string" } }
        }
      }
    }
  }
}
