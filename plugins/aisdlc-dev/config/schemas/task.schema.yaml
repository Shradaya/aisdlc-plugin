# JSON Schema for tasks/<ticket>/task.yaml (spec §17, §18, §42.14, §46). JSON-compatible YAML.
# Required shape is exactly what `aisdlc-state.js init` writes; optional sections are added later via `set`/`transition`.
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "aisdlc/task.schema.yaml",
  "title": "aisdlc task state",
  "type": "object",
  "required": ["task", "source", "repositories", "approvals", "release", "knowledge_consolidation"],
  "properties": {
    "task": {
      "type": "object",
      "required": ["id", "type", "lifecycle", "status", "state_version", "created_at", "updated_at"],
      "properties": {
        "id": { "type": "string", "pattern": "^[A-Z][A-Z0-9]*-\\d+$" },
        "type": { "type": "string", "description": "feature, bug, investigation, refactor, database-change, api-change, dependency-upgrade, documentation" },
        "lifecycle": { "enum": ["feature", "bug", "investigation"] },
        "status": {
          "enum": [
            "CREATED", "TICKET_READY", "UNDERSTOOD", "REPOSITORIES_PREPARED",
            "SPEC_APPROVED", "PLAN_APPROVED",
            "UNDER_INVESTIGATION", "ROOT_CAUSE_CONFIRMED",
            "IMPLEMENTING", "COMMITTED", "PR_CREATED",
            "MERGED", "RELEASED", "KNOWLEDGE_CONSOLIDATED", "COMPLETED",
            "BLOCKED", "WAITING_FOR_INPUT", "WAITING_FOR_APPROVAL", "CONFLICTED", "FAILED", "CANCELLED",
            "CI_FAILED", "JIRA_CHANGED", "SPEC_REVIEW_REQUIRED"
          ]
        },
        "state_version": { "type": "integer", "minimum": 0 },
        "created_at": { "type": "string" },
        "updated_at": { "type": "string" },
        "resume_state": { "type": "string", "description": "Set by the state engine while in a failure state." },
        "reason": { "type": "string" }
      }
    },
    "source": {
      "type": "object",
      "required": ["type", "snapshot_hash"],
      "properties": {
        "type": { "enum": ["jira", "user-provided", null] },
        "issue_key": { "type": "string" },
        "jira_available": { "type": "boolean" },
        "snapshot_hash": { "type": ["string", "null"], "pattern": "^sha256:" }
      }
    },
    "repositories": { "type": "array", "items": { "type": "string" } },
    "domains": { "type": "array", "items": { "type": "string" } },
    "workflow": {
      "type": "object",
      "description": "Per-stage progress (spec §17), written with `set workflow.<stage>`.",
      "properties": {
        "jira": { "type": "string" },
        "requirements": { "type": "string" },
        "impact_analysis": { "type": "string" },
        "repository_preparation": { "type": "string" },
        "specification": { "type": "string" },
        "specification_approval": { "type": "string" },
        "implementation_plan": { "type": "string" },
        "implementation": { "type": "string" },
        "validation": { "type": "string" },
        "review": { "type": "string" },
        "documentation": { "type": "string" },
        "commit": { "type": "string" },
        "pull_request": { "type": "string" },
        "ci": { "type": "string" },
        "merge": { "type": "string" },
        "production_release": { "type": "string" },
        "product_knowledge_consolidation": { "type": "string" },
        "temporary_artifact_cleanup": { "type": "string" }
      },
      "additionalProperties": { "type": "string" }
    },
    "approvals": {
      "type": "object",
      "required": ["specification", "plan"],
      "properties": {
        "specification": {
          "type": "object",
          "required": ["status", "version"],
          "properties": {
            "status": { "enum": ["pending", "approved", "rejected"] },
            "version": { "type": "integer", "minimum": 0 },
            "spec_hash": { "type": "string", "pattern": "^sha256:" },
            "approved_by": { "type": "string" },
            "approved_at": { "type": "string" },
            "reason": { "type": "string" },
            "rejected_at": { "type": "string" }
          }
        },
        "plan": {
          "type": "object",
          "required": ["status"],
          "properties": {
            "status": { "enum": ["pending", "approved", "rejected"] },
            "approved_by": { "type": "string" },
            "approved_at": { "type": "string" },
            "reason": { "type": "string" },
            "rejected_at": { "type": "string" }
          }
        }
      }
    },
    "commits": { "type": "object", "additionalProperties": { "type": "string" }, "description": "repository -> commit hash" },
    "pull_requests": { "type": "object", "additionalProperties": { "type": "string" }, "description": "repository -> PR URL" },
    "ci": {
      "type": "object",
      "properties": {
        "provider": { "type": "string" },
        "status": { "enum": ["pending", "running", "passed", "failed"] },
        "checks": { "type": "object", "additionalProperties": { "type": "string" } }
      }
    },
    "release": {
      "type": "object",
      "required": ["status", "environment", "reference", "released_at"],
      "properties": {
        "status": { "enum": ["not-released", "released"] },
        "environment": { "type": ["string", "null"] },
        "reference": { "type": ["string", "null"] },
        "released_at": { "type": ["string", "null"] },
        "evidence_source": { "enum": ["integration", "user-provided"] }
      }
    },
    "knowledge_consolidation": {
      "type": "object",
      "required": ["status", "product_documents_changed", "source_artifacts_deleted"],
      "properties": {
        "status": { "enum": ["pending", "in-progress", "completed"] },
        "product_documents_changed": { "type": "array", "items": { "type": "string" } },
        "consolidation_commit": { "type": "string" },
        "cleanup_commit": { "type": "string" },
        "validated": { "type": "boolean" },
        "unresolved_reconciliation": { "type": "integer", "minimum": 0 },
        "source_artifacts_deleted": { "type": "boolean" },
        "completed_at": { "type": "string" }
      }
    }
  }
}
