<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>aisdlc design preview</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Frozen header row 1: ticket / screen selectors -->
    <header class="bar">
      <strong class="brand">aisdlc design preview</strong>
      <label>Ticket
        <select id="ticket" aria-label="Design ticket"></select>
      </label>
      <label id="screen-wrap" hidden>Screen
        <select id="screen" aria-label="Screen"></select>
      </label>
      <button id="refresh" type="button">Refresh</button>
      <span id="status" class="status" role="status"></span>
    </header>

    <!-- Frozen header row 2: horizontal lifecycle progress -->
    <nav class="progress" id="progress" aria-label="Ticket state">
      <span class="badge" id="state-badge"></span>
      <ol class="stages" id="stages" aria-label="Lifecycle stages"></ol>
      <div class="next" id="next" hidden>
        <span class="next-label">Next</span>
        <span class="next-text" id="next-text"></span>
      </div>
    </nav>
    <p class="state-note" id="state-note" hidden></p>

    <!-- Scrollable preview area -->
    <main class="stage" id="stage">
      <iframe
        id="frame"
        title="Prototype preview"
        sandbox="allow-same-origin allow-forms allow-scripts allow-popups"
      ></iframe>
    </main>
    <section class="empty" id="empty" hidden>
      <p>
        No prototypes yet. Author one with <code>/aisdlc-design:design &lt;DESIGN-TICKET&gt;</code>, then Refresh.
      </p>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
