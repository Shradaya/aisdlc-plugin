# Design-authoring task type and state machine. Consumed by the design plugin's scripts/state/aisdlc-state.js and hooks.
# JSON-compatible YAML (full-line '#' comments only) so scripts parse it without dependencies.
{
  "design": {
    "states": ["CREATED","TICKET_READY","DESIGN_BRIEF","DESIGN_DRAFTED","AWAITING_DESIGN_APPROVAL","DESIGN_APPROVED","COMMITTED","COMPLETED"],
    "skip": { "DESIGN_APPROVED": ["COMMITTED"] },
    "source_edit_min_state": "DESIGN_BRIEF",
    "source_edit_max_state": "COMMITTED"
  },
  "failure_states": ["BLOCKED","WAITING_FOR_INPUT","WAITING_FOR_APPROVAL","CONFLICTED","FAILED","CANCELLED"],
  "other_types_use": "design",
  "next_steps": {
    "default": {
      "CREATED": ["claude", "Retrieve or confirm the design ticket number (Jira, or interactive questions if Jira is unavailable)."],
      "TICKET_READY": ["claude", "Build the design brief: ask whether to author directly in HTML/CSS or in Claude Design then export, and ask for any existing design for {T} to update."],
      "DESIGN_BRIEF": ["claude", "Author the prototype (design.md + prototype/ HTML/CSS) from the brief and the design system."],
      "DESIGN_DRAFTED": ["you", "Review designs/{T}/ in the preview app (by ticket number); check screens, states and copy."],
      "AWAITING_DESIGN_APPROVAL": ["you", "Approve with /aisdlc-design:approve {T} design, ask for changes, or /aisdlc-design:reject {T} design <reason>. The design is pinned by its hash on approval."],
      "DESIGN_APPROVED": ["claude", "Finalize the prototype and commit it to the design repository with /aisdlc-design:commit {T}."],
      "COMMITTED": ["you", "Push the design repository branch so developers can register and consume designs/{T}/."],
      "COMPLETED": ["none", "Nothing further; the design is published for developers to consume."]
    },
    "failure": {
      "BLOCKED": ["you", "Read the reason (tasks/{T}/task.yaml 'reason'), fix the cause, then resume."],
      "WAITING_FOR_INPUT": ["you", "Answer Claude's open questions, then resume."],
      "WAITING_FOR_APPROVAL": ["you", "Approve or reject the pending design gate with /aisdlc-design:approve {T} design or /aisdlc-design:reject {T} design <reason>."],
      "CONFLICTED": ["you", "The design folder or task state differs from the record. Inspect by hand, resolve, then resume."],
      "FAILED": ["you", "Read the failure in the log, fix the cause, then resume."],
      "CANCELLED": ["none", "The design task was cancelled."]
    }
  }
}
